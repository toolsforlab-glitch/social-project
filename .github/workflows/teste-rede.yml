name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          curl -sS -m 60 -A "Mozilla/5.0" -o e.pdf "https://www.ap.senai.br/images/SANTANA_Edital_Gratuidade_2__Semestre_-_n__08.2026_manifest_202606230944559872739.pdf"
          pdfinfo e.pdf | grep Pages
          pdftotext -layout e.pdf e.txt; sed -n "500,600p" e.txt | cut -c1-190
          echo ====; grep -n "ALMOXARIFE\|MESTRE DE OBRAS" e.txt | head
