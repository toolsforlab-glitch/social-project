name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import re
          from comum import baixar
          for u in ["https://www.ce.gov.br/", "https://www.ce.gov.br/?s=cagece+capacita",
                    "https://www.ce.gov.br/wp-json/wp/v2/posts?search=cagece%20capacita&per_page=5&_fields=date,link,title",
                    "https://www.ce.gov.br/tag/cagece-capacita/", "https://www.ce.gov.br/feed/?s=cagece+capacita"]:
              try:
                  h = baixar(u, timeout=40).decode("utf-8", "replace")
                  print("==", u, "OK", len(h)); print("   ", re.findall(r'https://www\.ce\.gov\.br/20\d\d/\d\d/\d\d/[^"<\s]*cagece[^"<\s]*', h)[:6] or h[:300].replace("\n"," "))
              except Exception as e:
                  print("==", u, "ERRO", type(e).__name__, str(e)[:150])
          PY
