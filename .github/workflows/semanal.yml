name: Cursos e resumo da semana
# corrida só com algumas pesquisas: nome «Só: …», para não contar como a corrida semanal completa (scripts/vez.py)
run-name: "${{ inputs.tarefas && format('Só: {0}', inputs.tarefas) || 'Cursos e resumo da semana' }}"

on:
  schedule:
    - cron: "23 8 * * 1"   # todas as segundas-feiras às 08:23 UTC (05:23 em Fortaleza)
    - cron: "23 14 * * 1"  # reserva às 14:23 UTC: só corre se a das 08:23 ainda não correu
  # Para testar sem esperar por segunda-feira: alterar o ficheiro disparar/semanal.txt
  push:
    branches: [main]
    paths: ["disparar/semanal.txt"]
  workflow_dispatch:
    inputs:
      tarefas:
        description: "Só estas pesquisas de cursos (IDs separados por vírgulas; vazio = todas as ativas)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# Sem fila partilhada: o GitHub só guarda uma rotina à espera por fila e cancela a anterior.
# A ordem entre rotinas é dada por scripts/vez.py (job "vez").

jobs:
  vez:
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      salta: ${{ steps.vez.outputs.salta }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar que acabem as rotinas anteriores (folha e repositório partilhados)
        run: python3 scripts/vez.py esperar
      - name: "Disparo de reserva: já correu hoje?"
        id: vez
        run: python3 scripts/vez.py ja-correu schedule,workflow_dispatch

  semanal:
    needs: vez
    # As rotinas só correm depois de ligadas: variável ROTINAS_ATIVAS = sim (Settings > Secrets and variables > Actions > Variables)
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' && needs.vez.outputs.salta != 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Procurar cursos gratuitos
        timeout-minutes: 30
        env:
          TAREFAS: ${{ inputs.tarefas }}
        run: cd scripts && python3 cursos.py

      - name: Verificar cursos e escrever o passo a passo
        if: ${{ always() }}
        timeout-minutes: 20
        run: cd scripts && python3 verificar.py

      - name: Verificar organizações e unidades (sem Claude)
        if: ${{ always() }}
        timeout-minutes: 15
        run: cd scripts && python3 verificar_organizacoes.py

      - name: Arquivar cursos e turmas terminados (sem Claude)
        if: ${{ always() }}
        timeout-minutes: 5
        run: cd scripts && python3 arquivar.py

      - name: Auditar e publicar os guias Antes de começar
        if: ${{ always() }}
        timeout-minutes: 10
        run: cd scripts && python3 guias.py

      - name: Propostas de parceiros aceites
        if: ${{ always() }}
        run: cd scripts && python3 parceiros.py

      - name: Turmas do Senac (páginas oficiais, sem Claude)
        if: ${{ always() }}
        timeout-minutes: 15
        run: cd scripts && python3 turmas.py

      - name: Turmas do Centec (página oficial, sem Claude)
        if: ${{ always() }}
        timeout-minutes: 10
        run: cd scripts && python3 centec.py

      - name: Editais do Senac Maranhão (documento oficial, Claude com prova por código)
        if: ${{ always() }}
        timeout-minutes: 15
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui antiword) > /dev/null 2>&1 || echo "conversores de Word não instalados"
          cd scripts && python3 senac_ma.py

      - name: Atualizar o site
        if: ${{ always() }}
        run: cd scripts && python3 construir_site.py

      - name: WhatsApp, cartaz e newsletter
        if: ${{ always() }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LISTA_ID: ${{ secrets.BREVO_LISTA_ID }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
        run: cd scripts && python3 semanal.py

      - name: Publicar
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs semanal estado
          git diff --cached --quiet || (git commit -q -m "Cursos e resumo $(date -u +%F)" && (git push -q || (git pull -q --rebase -X theirs && git push -q)))
