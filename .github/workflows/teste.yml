name: Teste do projeto social
on:
  push:
    branches: [teste-projeto-social]
permissions:
  contents: write
concurrency:
  group: projeto-social-teste
  cancel-in-progress: true
jobs:
  teste:
    if: ${{ !contains(github.event.head_commit.message, 'Resultado do teste') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEPURAR: "1"
      MODO_LOCAL: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Preparar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf logs estado/noticias-vistas.json; mkdir -p logs
          echo "inicio $(date -u +%T)" > logs/teste.txt
          cat > /tmp/guardar.sh <<'SH'
          git add -A docs estado semanal logs dados_locais
          git commit -q -m "Resultado do teste ($1) $(date -u +%H%M%S)" || exit 0
          git push -q || (git pull -q --rebase && git push -q)
          SH
          bash /tmp/guardar.sh inicio
      # O passo a testar escolhe-se na variável PASSO (organizacoes | tudo); "organizacoes" não gasta Claude
      - name: Verificar organizações
        timeout-minutes: 15
        run: cd scripts && { echo "### ORGANIZACOES $(date -u +%T)"; python3 verificar_organizacoes.py; echo "saida=$?"; } >> ../logs/teste.txt 2>&1
      - name: Guardar (organizações)
        if: ${{ always() }}
        run: bash /tmp/guardar.sh organizacoes
      - name: Site e semanal
        if: ${{ always() }}
        run: cd scripts && { echo "### SITE $(date -u +%T)"; python3 construir_site.py; echo "fim $(date -u +%T)"; } >> ../logs/teste.txt 2>&1
      - name: Guardar (fim)
        if: ${{ always() }}
        run: bash /tmp/guardar.sh fim
