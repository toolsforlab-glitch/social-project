name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import re
          from comum import baixar
          from base import texto_de_html
          t = texto_de_html(baixar("https://www.senaipa.org.br/_files/ugd/cf72c4_434f86f6a3e24e10a265cbeb3e8a3c81.pdf", timeout=90))
          for pat in [r"1\.1 DOCUMENTOS", r"2\.1", r"2\.2", r"3 \.? ?D", r"4 DOS CRIT", r"5 ?\.", r"6 ?\.", r"encerr", r"t[ée]rmino", r"in[íi]cio das aulas", r"pr[ée]-requisito", r"Gratuidade Regimental"]:
              for m in list(re.finditer(pat, t))[:2]:
                  print("==", pat, "::", t[m.start():m.start()+700])
          b = baixar("https://www.senaipa.org.br/escolas-1/senai-bel%C3%A9m-get%C3%BAlio-vargas", timeout=60).decode("utf-8","replace")
          i = b.find("Planejador de Manuten")
          print("== HTML ::", re.sub(r"\s+", " ", b[i-600:i+1500]))
          PY
