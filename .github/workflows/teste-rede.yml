name: Teste de rede (temporário)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rede:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://sebrae.com.br/sites/PortalSebrae/cursosonline" "https://www.sebrae.com.br/sites/PortalSebrae/cursosonline" \
                   "https://loja.sebrae.com.br/" "https://loja.sebrae.com.br/cursos" "https://ead.senac.br/" "https://www.ead.senac.br/gratuito/" \
                   "https://www.sp.senac.br/cursos-gratuitos" "https://www.senaispvirtual.com.br/" "https://mundosenai.com.br/cursos-gratuitos/" ; do
            code=$(curl -s -L -o /tmp/o -w "%{http_code}" -m 25 -A "Mozilla/5.0" "$u"); echo "R $code $(wc -c < /tmp/o 2>/dev/null) $u"; done
