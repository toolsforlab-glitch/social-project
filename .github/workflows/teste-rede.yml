name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Ensaio das vigias de EJA (sem planilha)
        run: cd scripts && SECO=1 DIAS_ENSAIO=45 python3 vigiar.py 2>&1 | grep -A6 "EJA" | head -150
      - name: CadEJA
        run: |
          set +e
          curl -sL -m 40 -A "Mozilla/5.0" -o c.html -w "%{http_code} %{url_effective}\n" https://cadeja.mec.gov.br/
          python3 -c "import re,html;t=open('c.html',encoding='utf-8',errors='replace').read();x=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<script.*?</script>|<style.*?</style>|<[^>]+>',' ',t)));print(len(t));print(x[:2500])"
