name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in senai/feed/ senai/wp-sitemap.xml senai/sitemap_index.xml senai/chamada-publica/ senai/wp-content/uploads/sites/16/2026/ senai/robots.txt; do
            curl -sS -m 40 -A "Mozilla/5.0" -o /tmp/o -w "$u %{http_code} %{content_type}\n" "https://fieam.org.br/$u" || true; head -c 300 /tmp/o | tr '\n' ' '; echo; done
