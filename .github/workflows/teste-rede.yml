name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          B=https://www.cetam.am.gov.br/wp-content/uploads/2026
          for f in 10/Edital-011-2026-Qualificacao-Profissional-EaD 08/Edital-009-2026-Qualificacao-Profissional-Capital; do
            curl -sS -m 60 -A "Mozilla/5.0" -o e.pdf "$B/$f.pdf"; echo "== $f"
            pdftotext -layout e.pdf e.txt; grep -n -i "anexo" e.txt | head -8
            L=$(grep -n "INFORMÁTICA BÁSICA\|Informática Básica" e.txt | sed -n 3p | cut -d: -f1); echo "linha $L"
            sed -n "$((L-30)),$((L+25))p" e.txt | sed 's/    */ | /g' | cut -c1-240
          done
