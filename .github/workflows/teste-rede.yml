name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (X11; Linux x86_64) Chrome/120"
          curl -sS -m 25 -A "$A" -H "Accept: application/json" https://treinarparaempregar.salvador.ba.gov.br/api/cursos -o /tmp/s.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/s.json'))
          print(type(d).__name__, len(d)); print("CAMPOS", sorted(d[0].keys()))
          for c in d:
              print("---", c.get("id"), c.get("slug"), "|", c.get("title"), "| mod:", c.get("modality"), "| open:", c.get("enrollment_open"), c.get("enrollment_status"), "| insc:", c.get("enrollment_start"), "->", c.get("enrollment_end"), "| inicio:", c.get("course_start_date"), c.get("course_end_date"), "| vagas:", c.get("total_vacancies"), c.get("available_vacancies"), "| ch:", c.get("workload"), "| local:", c.get("location"), "| parceiro:", (c.get("partner") or {}).get("name") if isinstance(c.get("partner"),dict) else c.get("partner"), "| link:", c.get("enrollment_link"), "| women:", c.get("women_only"), "adults:", c.get("adults_only"), "| prereq:", str(c.get("prerequisites"))[:80])
              print("   DESC:", (c.get("description") or "").replace("\n"," / ")[:500])
          PY
          echo "####### FORTALEZA"
          F=https://maisfuturo.sde.fortaleza.ce.gov.br
          curl -sSL -m 25 -A "$A" $F/ -o /tmp/fh
          for p in $(grep -oE 'href="[a-z0-9_]+\.php"' /tmp/fh | cut -d'"' -f2 | sort -u); do
            curl -sSL -m 20 -A "$A" "$F/$p" -o /tmp/f || continue
            python3 - "$p" <<'PY'
          import re,html,sys
          t=open('/tmp/f',encoding='utf-8',errors='replace').read()
          s=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<!--.*?-->|<(script|style).*?</\1>|<[^>]+>',' ',t)))
          m=re.search(r'Previsão de Início do Curso:\s*([^T]{0,30}?)\s+Turno',s)
          st='ENCERRADAS' if 'INSCRIÇÕES ENCERRADAS' in s else ('ABERTAS?' )
          if st!='ENCERRADAS': print(sys.argv[1], st, (m.group(1) if m else '?'), s[s.find('Carga Horária')-80:s.find('Carga Horária')+400] if 'Carga Horária' in s else s[-600:])
          PY
          done
          echo FIM
