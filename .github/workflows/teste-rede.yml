name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import re
          from comum import baixar
          from base import texto_de_html
          S = "https://www.pa.senac.br"
          for u in [S + "/psg/selecao", S + "/psg/selecao/detalhar/belem/3/89", S + "/psg",
                    S + "/send4/arquivos/edital/versaoassinadaparaimpressao.pdf", S + "/psg/como-se-inscrever"]:
              try:
                  b = baixar(u, timeout=60); t = texto_de_html(b)
                  print("==", u, "OK", len(b), "| detalhar:", len(set(re.findall(rb"detalhar/[a-z\-]+/\d+/\d+", b))), "| Abertas:", b.count(b"Inscri\xc3\xa7\xc3\xb5es Abertas"))
                  for m in re.finditer(r".{0,160}(gratuit(?!dade)|sem custo|sem nenhum custo|isento|isen[çc][ãa]o|n[ãa]o ter[áa] custo).{0,160}", t, re.I):
                      print("   ~", m.group(0)[:330])
              except Exception as e:
                  print("==", u, "ERRO", type(e).__name__, str(e)[:150])
          PY
