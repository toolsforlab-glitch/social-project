name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          for u in https://centraldacidadania.com.br/ http://www.centraldacidadania.com.br/noticias https://www.moc.org.br/ https://www.moc.org.br/educativando https://oela.org.br/ https://www.oela.org.br/ ; do
            echo "######## $u"; : > p.html; curl -sSL -m 40 -A "Mozilla/5.0" "$u" -o p.html -w "HTTP %{http_code} %{url_effective}\n"
            python3 - <<'P'
          import re,html
          t=open("p.html",encoding="utf-8",errors="replace").read()
          links=set(re.findall(r'href="([^"#]+)"[^>]*>([^<]{3,80})<',t))
          for h,a in sorted(links):
              if re.search(r"curso|inscri|qualifica|capacita|edital|noticia|matr",h+a,re.I): print("LINK",a.strip()[:60],"->",h[:120])
          txt=html.unescape(re.sub(r"<[^>]+>"," ",re.sub(r"<script.*?</script>|<style.*?</style>","",t,flags=re.S)))
          for m in re.finditer(r"[^.\n]{0,120}(inscri[çc][õo]es|inscreva|curso[s]? gratuito|Qualifica Bahia|Qualifica Amapá)[^.\n]{0,160}",txt,re.I):
              print("TXT",re.sub(r"\s+"," ",m.group(0))[:280])
          P
          done
