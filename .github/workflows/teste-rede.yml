name: Teste de rede (temporário)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Lista do SENAI PE
        working-directory: scripts
        run: |
          python3 - <<'PY'
          from senac_ma import FONTES, listar_senai_pe
          f = next(x for x in FONTES if x["nome"] == "Senai PE")
          ed = listar_senai_pe(f)
          print(len(ed), "editais")
          for e in sorted(ed, key=lambda e: e["published_at"], reverse=True)[:25]:
              print(e["published_at"], "|", e["title"][:120], "| avisos:", len(e["avisos"]))
          PY
