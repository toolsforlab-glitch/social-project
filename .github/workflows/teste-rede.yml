name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || pip install -q pypdf requests
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils >/dev/null
      - run: |
          cd scripts && python3 - <<'PY'
          import senac_ma as s, json
          from comum import claude, extrair_json
          f = next(x for x in s.FONTES if x["nome"] == "Senai AL")
          s.hoje_ceara = lambda: "2026-09-08"
          e = s.listar_senai_al(f)[0]
          texto = s.recortar(s.texto_do_documento(s.baixar(e["documents"][0]["url"], timeout=60), "application/pdf"),
                             f.get("anexo", r"ANEXO\s+I\b"), f.get("max_caracteres", s.MAX_CARACTERES))
          texto += f"\n\n=== INFORMAÇÕES DESTE EDITAL NA PÁGINA OFICIAL ({e.get('pagina')}) ===\n{e['texto_pagina']}"
          sistema = s.SISTEMA.replace("Senac Maranhão (Programa Senac de Gratuidade)", f["entidade"]).replace(
              "Programa Senac de Gratuidade", f.get("programa", "Programa Senac de Gratuidade"))
          sistema = sistema.replace("\n\nDevolve só JSON", f"\n- {f['nota']}\n\nDevolve só JSON")
          r, uso = claude("claude-haiku-5-5", sistema, f"Título do edital: {e['title']}\n\nTexto do edital:\n{texto}", max_tokens=8000)
          res = extrair_json(r)
          ed, prob = s.provar(res, texto, e.get("published_at") or "")
          print("PROBLEMAS", prob, "INSC", ed.get("ini"), ed.get("fim"), "GRATIS", ed.get("gratuito"))
          for t in ed["turmas"]:
              print("T", t.get("curso"), "|", t.get("cidade"), "|", t.get("inicio_aulas"), "|", t.get("horario"), "|", t.get("nome_ocr", ""))
          print("PROPOSTAS", len(res.get("turmas") or []), "PROVADAS", len(ed["turmas"]))
          for t in res.get("turmas") or []:
              if not any(x.get("frase") == t.get("frase") for x in ed["turmas"]):
                  print("REJEITADA", t.get("curso"), "||", t.get("frase"))
          PY
