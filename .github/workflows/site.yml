name: Atualizar o site

# Corre quando se muda o aspeto do site, ou à mão depois de editar a folha.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/construir_site.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projeto-social
  cancel-in-progress: false

jobs:
  site:
    # As rotinas só correm depois de ligadas: variável ROTINAS_ATIVAS = sim (Settings > Secrets and variables > Actions > Variables)
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Turmas do Senac (páginas oficiais, sem Claude)
        timeout-minutes: 15
        run: cd scripts && python3 turmas.py || echo 'Turmas não atualizadas'

      - name: Turmas do Centec (página oficial, sem Claude)
        timeout-minutes: 10
        run: cd scripts && python3 centec.py || echo 'Centec não atualizado'

      - name: Gerar o site a partir da folha
        run: cd scripts && python3 construir_site.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -q -m "Site atualizado" && (git push -q || (git pull -q --rebase && git push -q)))
