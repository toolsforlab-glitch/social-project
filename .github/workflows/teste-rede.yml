name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por tesseract-ocr-osd poppler-utils >/dev/null
      - run: |
          curl -sL -o e.pdf https://al.senai.br/wp-content/uploads/2026/09/edital-senai.pdf
          pdfimages -list e.pdf | head -12
          for pg in 4 5; do
            pdftoppm -r 300 -png -f $pg -l $pg e.pdf p
            f=$(ls p-*.png); python3 -c "import struct;d=open('$f','rb').read(24);print('size',struct.unpack('>II',d[16:24]))"
            tesseract $f - --psm 0 2>&1 | grep -i "rotate\|orient" 
            for m in 4 11; do echo "--- page $pg psm $m"; tesseract $f - -l por --psm $m 2>/dev/null | grep -v "^\s*$" | head -25; done
            rm -f p-*.png
          done
