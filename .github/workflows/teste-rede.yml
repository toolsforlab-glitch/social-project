name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import re
          import senac_pa as s
          from comum import baixar
          from base import texto_de_html, citacao_valida
          lista = baixar(s.LISTA, timeout=60).decode("utf-8", "replace")
          ab = s.selecoes_abertas(lista)
          ti = texto_de_html(baixar(s.PAGINA_INSCRICAO, timeout=60)); tp = texto_de_html(baixar(s.PAGINA_PSG, timeout=60))
          print("== abertas", len(ab), "| gratuito", citacao_valida(s.FRASE_GRATUIDADE, ti), "| renda", citacao_valida(s.FRASE_RENDA, tp),
                "| ordem:", (re.search(r"[^.]*por ordem de inscrição[^.]*\.", ti) or [""])[0])
          for u in ab[:4]:
              n, cid, cs = s.cursos_da_selecao(u)
              print("==", n, cid, len(cs), u)
              for c in cs[:4]:
                  print("   ~", {k: c[k] for k in ("nome", "modo", "insc_ini", "prazo", "ini", "fim", "botao")}, "|", s.idade_escolaridade(c["pre"]), "|", c["local"][:60])
          PY
