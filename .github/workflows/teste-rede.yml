name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt pypdf
      - run: |
          cd scripts && python3 - <<'PY'
          import re, io, urllib.parse, html as h
          from comum import baixar
          from pypdf import PdfReader
          t=baixar("https://portal.ac.senac.br/psg/editais",timeout=60).decode("utf-8","replace")
          urls=[urllib.parse.quote(h.unescape(u if u.startswith("http") else "https://portal.ac.senac.br"+u), safe=":/%") for u in re.findall(r'href="([^"]+\.pdf)"',t,re.I) if re.search(r"_135_",u)]
          print(urls)
          for u in urls:
              if re.search(r"aviso|retifica|prorroga|altera|errata",u,re.I):
                  r=PdfReader(io.BytesIO(baixar(u,timeout=60))); tx="\n".join(p.extract_text() or "" for p in r.pages)
                  print("=== AVISO", u); print(re.sub(r"[ \t]+"," ",tx)[:3000])
          PY
