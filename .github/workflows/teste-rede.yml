name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0" https://send3.ap.senac.br/send3/resources/site/js/pss_psg.min.js -o ap.js
          grep -oE '.{0,60}base_url.{0,90}' ap.js | head -20
          echo ====; grep -oE '.{0,40}(site/psg|/psg/)[^"]{0,60}' ap.js | sort -u | head -20
          echo ====; curl -sS -m 30 -A "Mozilla/5.0" https://send3.ap.senac.br/send3/site/psg | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 1500
