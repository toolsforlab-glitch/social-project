name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          curl -sS -m 60 -A "Mozilla/5.0" -o e.pdf "https://www.ap.senai.br/files/EDITAL_N__12.2026_PSAI_G_NERO_-_CURSO_DE_APERFEI_OAMENTO_SAN_202610051400309156352.pdf"
          pdfinfo e.pdf | grep -E "Pages|Producer|Creator"
          pdftotext e.pdf - | wc -c
          pdftotext e.pdf - | tr '\n' ' ' | sed 's/  */ /g' | grep -oiE ".{0,250}(inscriç|gratuit|sele[çc][ãa]o|ordem|sorteio|vagas ser).{0,250}" | head -14
          echo ====; pdftotext -layout e.pdf - | grep -n -i -A12 "Reparos" | head -40
