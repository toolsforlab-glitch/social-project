name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          from comum import baixar
          from base import texto_de_html
          for u in [                    "https://escoladotrabalhador40.tawk.help/article/certificado-como-emitir-posso-utilizar-para-horas-complementares-posso-utilizar-como-curso-t%C3%A9cnico",
                    "https://escoladotrabalhador40.tawk.help/article/cat%C3%A1logo-de-cursos"]:
              try:
                  b = baixar(u, timeout=120); t = texto_de_html(b) if b[:1] != b"{" else b.decode()
                  print("==", u, "OK", len(b), "| course-card:", b.count(b"data-course-id"), "| cert gratuito:", "sendo gratuito" in t, "| cursos gratuitos:", "cursos gratuitos" in t)
                  print(t[:200])
              except Exception as e:
                  print("==", u, "ERRO", type(e).__name__, str(e)[:150])
          PY
