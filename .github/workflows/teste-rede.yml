name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || pip install -q pypdf requests
      - run: |
          cd scripts && python3 - <<'PY'
          import senac_ma, json
          f = next(x for x in senac_ma.FONTES if x["nome"] == "Senai AL")
          print("HOJE REAL:", json.dumps(senac_ma.listar_senai_al(f), ensure_ascii=False)[:300])
          senac_ma.hoje_ceara = lambda: "2026-09-08"
          r = senac_ma.listar_senai_al(f)
          for e in r:
              print("EDITAL", e["title"], e["documents"][0]["url"], e["avisos"], e["published_at"])
              print(e["texto_pagina"][:900].replace("\n", " / "))
          d = senac_ma.baixar(r[0]["documents"][0]["url"], timeout=60)
          t = senac_ma.texto_do_documento(d, "application/pdf")
          print("PDF CHARS", len(t)); print(t[:2500])
          PY
