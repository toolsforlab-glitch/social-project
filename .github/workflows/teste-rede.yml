name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import re
          from base import texto_de_html
          from comum import baixar
          def ver(u, pad, n=8):
              try:
                  t=texto_de_html(baixar(u,timeout=40).decode("utf-8","replace"))
              except Exception as e:
                  print("##", u, "ERRO", e); return
              print("##", u, len(t))
              for m in list(re.finditer(pad, t, re.I))[:n]:
                  print("   >", re.sub(r"\s+"," ",t[max(0,m.start()-200):m.end()+250]))
          ver("https://www.escolavirtual.gov.br/cursos/empregabilidade-com-o-copilot", r"p[úu]blico|qualquer|cidad[ãa]o|aberto a")
          ver("https://www.escolavirtual.gov.br/perguntas-frequentes", r"qualquer pessoa|qualquer cidad|p[úu]blico em geral|quem pode|todos os cidad|sociedade")
          ver("https://www.escolavirtual.gov.br/sobre", r"qualquer pessoa|qualquer cidad|p[úu]blico em geral|quem pode|sociedade|cidad[ãa]os")
          ver("https://www.fortaleza.ce.gov.br/noticias/prefeitura-de-fortaleza-oferta-7-3-mil-vagas-em-32-cursos-gratuitos-de-capacitacao-profissional", r"inscri|site|link|gratuit|at[ée] o dia", 12)
          PY
