name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 scripts/vez.py esperar
      - run: python3 scripts/tmp_teste/eja_ifap.py
      - name: IFPB edições do EJA-EPT
        run: |
          set +e
          for e in 472 473 474 475 476 477 478; do
            curl -sL -m 40 -A "Mozilla/5.0" -o e.html https://estudante.ifpb.edu.br/processoseletivo/processo/7/edicao/$e/
            echo "=== $e"; python3 -c "import re,html;t=open('e.html',encoding='utf-8',errors='replace').read();x=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<script.*?</script>|<style.*?</style>|<[^>]+>',' ',t)));i=x.find('Assuntos Estudantis',3000);print(x[i+20:i+1500]);print([l for l in re.findall(r'href=\"([^\"]+)\"',t) if re.search(r'media|\.pdf',l,re.I)][:12])"
          done
