name: Teste de rede (temporário)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Textos Senac AL
        working-directory: scripts
        run: |
          python3 - <<'PY'
          import re
          from senac_ma import FONTES, listar_senac_al, texto_do_documento
          from comum import baixar
          f = next(x for x in FONTES if x["nome"] == "Senac AL")
          for e in listar_senac_al(f):
              if not re.search(r"23-2026", e["number"]):
                  continue
              import io
              from pypdf import PdfReader
              dados = baixar(e["pagina"], timeout=60)
              t = "\n".join((p.extract_text(extraction_mode="layout") or "") for p in PdfReader(io.BytesIO(dados)).pages)
              i = t.upper().find("ANEXO I")
              print("=====", e["title"], len(t)); print(re.sub(r" {3,}", " | ", t[i:i+7000]))
          PY
