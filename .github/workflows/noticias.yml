name: Notícias do dia

on:
  schedule:
    - cron: "17 9 * * *"   # todos os dias às 09:17 UTC (06:17 em Fortaleza)
    - cron: "17 13 * * *"  # reserva às 13:17 UTC: só corre se a das 09:17 ainda não correu (o GitHub atrasa horas)
  # Para testar sem esperar pela hora marcada: alterar o ficheiro disparar/noticias.txt
  push:
    branches: [main]
    paths: ["disparar/noticias.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Sem fila partilhada: o GitHub só guarda uma rotina à espera por fila e cancela a anterior.
# A ordem entre rotinas é dada por scripts/vez.py (job "vez").

jobs:
  vez:
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      salta: ${{ steps.vez.outputs.salta }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar que acabem as rotinas anteriores (folha e repositório partilhados)
        run: python3 scripts/vez.py esperar
      - name: "Disparo de reserva: já correu hoje?"
        id: vez
        run: python3 scripts/vez.py ja-correu schedule,workflow_dispatch

  diario:
    needs: vez
    # As rotinas só correm depois de ligadas: variável ROTINAS_ATIVAS = sim (Settings > Secrets and variables > Actions > Variables)
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' && needs.vez.outputs.salta != 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Escolher e resumir as notícias
        run: cd scripts && python3 noticias.py

      - name: Propostas de parceiros aceites
        if: ${{ always() }}
        run: cd scripts && python3 parceiros.py

      - name: Turmas do Senac (páginas oficiais, sem Claude)
        if: ${{ always() }}
        timeout-minutes: 15
        run: cd scripts && python3 turmas.py

      - name: Turmas do Centec (página oficial, sem Claude)
        if: ${{ always() }}
        timeout-minutes: 10
        run: cd scripts && python3 centec.py

      - name: Editais do Senac Maranhão (documento oficial, Claude com prova por código)
        if: ${{ always() }}
        timeout-minutes: 15
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui antiword) > /dev/null 2>&1 || echo "conversores de Word não instalados"
          cd scripts && SENAC_MA_DIAGNOSTICO=/tmp/senac_ma python3 senac_ma.py

      - name: Guardar o diagnóstico do Senac Maranhão (7 dias, só para conferir)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: senac-ma-diagnostico
          path: /tmp/senac_ma
          retention-days: 7
          if-no-files-found: ignore

      - name: Atualizar o site a partir da folha
        if: ${{ always() }}
        run: cd scripts && python3 construir_site.py

      - name: Publicar
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado
          git diff --cached --quiet || (git commit -q -m "Notícias e site $(date -u +%F)" && (git push -q || (git pull -q --rebase -X theirs && git push -q)))
