name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          A="Mozilla/5.0 (X11; Linux x86_64) Chrome/120"
          cd scripts
          python3 - <<'PY'
          import re,html
          from comum import baixar
          t=baixar("https://www.se.senai.br/cursos",timeout=60).decode("utf-8","replace")
          print("tamanho",len(t))
          ids=re.findall(r'DetalheCurso/(\d+)',t); print("cursos",len(set(ids)))
          for kw in ("GRATUIT","Gratuit","gratuit"):
              print(kw, t.count(kw))
          i=t.find('DetalheCurso/'+ids[0]); print("=== bloco 1 ===\n", re.sub(r'\s+',' ',t[max(0,i-2500):i+300]))
          j=t.lower().find('gratuit'); print("=== em volta de gratuit ===\n", re.sub(r'\s+',' ',t[max(0,j-1500):j+800]))
          PY
          python3 - <<'PY'
          import re,html
          from comum import baixar
          t=baixar("https://app.fies.org.br/MatriculaWebSENAI/Cursos/DetalheCurso/1622",timeout=60).decode("utf-8","replace")
          s=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<(script|style).*?</\1>|<[^>]+>',' ',t)))
          print("=== DetalheCurso 1622 ===\n", s[:3000])
          PY
          echo "#### SENAC SE api"
          for e in /api/cursos /api/courses /api/psg/cursos /api/turmas /api/ofertas /api/cursos/gratuitos; do curl -sS -m 15 -A "$A" "https://psg.se.senac.br$e" -o /tmp/a -w "$e %{http_code} %{content_type} %{size_download}\n"; head -c 300 /tmp/a; echo; done
          curl -sSL -m 25 -A "$A" https://psg.se.senac.br/cursos -o /tmp/c
          for j in $(grep -oE '/_next/static/chunks/[a-z0-9]+\.js' /tmp/c | sort -u); do curl -sS -m 20 -A "$A" "https://psg.se.senac.br$j" -o /tmp/j.js; grep -oE ".{0,80}(fetch\(|axios|baseURL|/api/|NEXT_PUBLIC)[^;]{0,160}" /tmp/j.js | head -8; done 2>/dev/null | grep -v "^$" | sort -u | head -40
