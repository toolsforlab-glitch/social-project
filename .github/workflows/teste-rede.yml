name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          from base import Base, carregar_config
          b = Base(); carregar_config(b)
          tur = [t for t in b.tabela("Turmas") if "Bolsas-Gratuitas-24-2026" in (t.get("Link da turma") or "")]
          ids = {t.get("Curso") for t in tur}
          outras = {t.get("Curso") for t in b.tabela("Turmas") if "Bolsas-Gratuitas-24-2026" not in (t.get("Link da turma") or "")}
          cur = [r for r in b.tabela("Cursos") if r.get("ID") in ids and r.get("ID") not in outras and r.get("Origem") == "turmas" and r.get("Estado") != "Publicado"]
          print("TURMAS", len(tur), [ (t["_linha"], t.get("Título na fonte"), t.get("Estado")) for t in tur])
          print("CURSOS", len(cur), [(r["_linha"], r.get("Título"), r.get("Estado")) for r in cur])
          b.remover_linhas("Turmas", [t["_linha"] for t in tur])
          b.remover_linhas("Cursos", [r["_linha"] for r in cur])
          b.guardar()
          PY
