name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import escola_trabalhador as e
          from comum import baixar
          from base import texto_de_html, citacao_valida, certificado_da_frase
          b = baixar(e.SITE, timeout=60).decode("utf-8", "replace")
          f = texto_de_html(baixar(e.FAQ_CERTIFICADO, timeout=120))
          print("== gratuito", citacao_valida(e.FRASE_GRATUITO, texto_de_html(b.encode())), "| cert", citacao_valida(e.FRASE_CERTIFICADO, f),
                "| aprov", citacao_valida(e.FRASE_APROVACAO, f), "| regra", certificado_da_frase("gratuito", e.FRASE_CERTIFICADO))
          ts = e.trilhas(b)
          print("== trilhas", len(ts), sum(len(t["cursos"]) for t in ts))
          for t in ts:
              print("==", t["titulo"], "|", "; ".join(n for _, n in t["cursos"])[:150])
          print("== desc", e.descricao_curso(ts[17]["cursos"][0][0]))
          PY
