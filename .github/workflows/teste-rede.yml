name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || pip install -q pypdf requests
      - run: |
          cd scripts && python3 - <<'PY'
          import senac_ma as s, re
          u = "https://tecnico.senaibahia.com.br/wp-content/uploads/2026/10/Edital-PS-CHP-2027.1_VF_Chancelado.pdf"
          t = s.texto_do_documento(s.baixar(u, timeout=60), "application/pdf")
          i = t.find("ANEXO I")
          print("ANEXO I @", i, [m.start() for m in re.finditer("ANEXO", t)][:12])
          j = t.find("Alagoinhas", i)
          print(t[j-1500:j+3500])
          PY
