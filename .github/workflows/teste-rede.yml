name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Ifap
        run: |
          set +e
          curl -sL -m 60 -A "Mozilla/5.0" -o ifap.pdf https://www.ifap.edu.br/documents/1317/Edital_PROEJA_2027.pdf
          pdftotext -layout ifap.pdf ifap.txt
          sed -n '10,30p;48,140p;228,262p' ifap.txt
          grep -n -i -E "gratuit|taxa|gov\.br|processoseletivo|endere|documentos? (necess|exig)" ifap.txt | head -30
      - name: IFPB
        run: |
          set +e
          curl -sL -m 40 -A "Mozilla/5.0" -o p7.html https://estudante.ifpb.edu.br/processoseletivo/processo/7/
          python3 -c "import re,html;t=open('p7.html',encoding='utf-8',errors='replace').read();x=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<script.*?</script>|<style.*?</style>|<[^>]+>',' ',t)));i=x.find('Assuntos Estudantis',3000);print(x[i:i+5000]);print(sorted(set(l for l in re.findall(r'href=\"([^\"]+)\"',t) if re.search(r'processo|edital|media',l,re.I)))[:80])"
