name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.centraldacidadania.com.br/ https://www.centraldacidadania.com.br/noticias https://www.moc.org.br/ https://oela.org.br/ https://www.oela.org.br/ ; do
            echo "######## $u"; curl -sSL -m 40 -A "Mozilla/5.0" "$u" -o p.html -w "HTTP %{http_code} %{url_effective}\n" || true
            python3 - <<'P'
          import re,html
          t=open("p.html",encoding="utf-8",errors="replace").read()
          txt=html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>","",t,flags=re.S))
          links=set(re.findall(r'href="([^"#]+)"[^>]*>([^<]{3,80})<',t))
          for h,a in sorted(links):
              if re.search(r"curso|inscri|qualifica|capacita|edital|noticia|matr",h+a,re.I): print("LINK",a.strip()[:60],"->",h[:120])
          for m in re.finditer(r"[^.\n]{0,120}(inscri[çc][õo]es|inscreva|curso[s]? gratuito|Qualifica Bahia|Qualifica Amapá)[^.\n]{0,160}",re.sub(r"<[^>]+>"," ",txt),re.I):
              print("TXT",re.sub(r"\s+"," ",m.group(0))[:280])
          P
          done
