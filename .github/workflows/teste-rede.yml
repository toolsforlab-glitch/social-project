name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0"
          curl -sSL -m 25 -A "$A" https://psg.pi.senac.br/ -o /tmp/p -w "%{http_code} %{size_download} %{url_effective}\n"
          echo "== links"; grep -oiE '(href|src|action)="[^"]*"' /tmp/p | sort -u | head -60
          echo "== texto"; sed 's/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' /tmp/p | tr -s ' \n' | head -c 3000; echo
          echo "== js/api"; grep -oiE '"/?(api|wp-json|ajax)[^"]*"|fetch\([^)]*\)|axios[^;]{0,120}' /tmp/p | head -20
          curl -sSL -m 25 -A "$A" "https://www.pi.senac.br/cursos/list?modalidade_id=curso_livre" -o /tmp/l -w "lista: %{http_code} %{size_download}\n"
          sed 's/<[^>]*>/ /g' /tmp/l | tr -s ' \n' | grep -iE "gratuit|psg|R\\$" | head -10
