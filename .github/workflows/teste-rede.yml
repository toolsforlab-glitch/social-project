name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FOLHA_ID: ${{ secrets.FOLHA_ID }}
        run: |
          cd scripts && python3 - <<'PY'
          from base import Base
          b=Base(); hoje="2026-11-23"
          print("=== CURSOS Rever/Novo")
          for r in b.tabela("Cursos"):
              if r.get("Estado") in ("Rever","Novo"):
                  ate=r.get("Inscrições até","")
                  if ate and ate<hoje: continue
                  print(f"L{r['_linha']} {r['ID']} [{r['Estado']}] {r.get('Local')} | {r['Título'][:55]} | {r.get('Entidade','')[:35]} | até {ate or '?'} | sit {r.get('Situação das inscrições','')} | comprov {r.get('Campos comprovados','')} | falta: {(r.get('O que falta confirmar') or '')[:120]} | link {r.get('Link','')[:90]}")
          print("=== TURMAS Rever")
          for t in b.tabela("Turmas"):
              if t.get("Estado")=="Rever" and t.get("Situação") in ("Aberta","Por abrir"):
                  print(f"T{t['_linha']} {t.get('Curso')} {t.get('Título na fonte','')[:50]} | {t.get('Cidade','')} | prazo {t.get('Prazo de inscrição','')} | {t.get('Situação')} | aud: {(t.get('Auditoria') or '')[:160]} | notas: {(t.get('Notas') or '')[:100]}")
          PY
