name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || pip install -q pypdf requests
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils >/dev/null
      - run: |
          for u in https://al.senai.br/wp-content/uploads/2026/09/edital-senai.pdf https://al.senai.br/wp-content/uploads/2026/09/Senai.pdf; do
            curl -sL -o e.pdf "$u"; pdfinfo e.pdf | grep -i "pages\|producer\|creator"; pdffonts e.pdf | head -5
            pdftoppm -r 200 -png -f 1 -l 4 e.pdf p; for f in p-*.png; do tesseract $f - -l por 2>/dev/null; done | head -150; rm -f p-*.png
            echo ==========
          done
