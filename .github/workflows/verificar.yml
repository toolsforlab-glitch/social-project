name: Só verificar os cursos (manual)
# Corre só a verificação dos cursos (verificar.py) e reconstrói o site, sem pesquisas novas, sem newsletter e sem
# WhatsApp. Serve para testar mudanças na verificação sem esperar pela rotina semanal de segunda-feira.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  vez:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar que acabem as rotinas anteriores (folha e repositório partilhados)
        run: python3 scripts/vez.py esperar

  verificar:
    needs: vez
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Verificar cursos
        timeout-minutes: 25
        run: cd scripts && python3 verificar.py

      - name: Gerar o site a partir da folha
        if: ${{ always() }}
        run: cd scripts && python3 construir_site.py

      - name: Publicar
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado
          git diff --cached --quiet || (git commit -q -m "Cursos verificados" && (git push -q || (git pull -q --rebase -X theirs && git push -q)))
