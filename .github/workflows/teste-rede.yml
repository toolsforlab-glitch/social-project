name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0" https://www.ro.senac.br/edital-psg/ -o ro.html
          python3 - <<'P'
          import re,html
          t=open('ro.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'<a[^>]+href="([^"]+\.pdf)"[^>]*>(.*?)</a>', t, re.S):
              print('RO', html.unescape(re.sub('<[^>]+>','',m.group(2))).strip()[:90], '|', m.group(1)[-90:])
          i=t.find('2026'); print(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',t[i-3000:i+3000]))[:2500])
          P
          echo ======= AP
          curl -sS -m 30 -A "Mozilla/5.0" https://send3.ap.senac.br/send3/site/psg | sed 's/></>\n</g' | grep -iE "script|api|url|edital|ajax" | head -20
          curl -sS -m 30 -A "Mozilla/5.0" https://www.ap.senac.br/ | grep -oE 'src="[^"]+\.js"' | head
