name: Rodar um passo (manual)
run-name: "Só: ${{ inputs.passo }}"
# Roda só um passo (por omissão, a verificação dos cursos) e reconstrói o site, sem pesquisas novas, sem newsletter
# e sem WhatsApp. Serve para testar mudanças sem esperar pelas rotinas diária e semanal.

on:
  workflow_dispatch:
    inputs:
      passo:
        description: "Passo para rodar"
        type: choice
        options: [verificar.py, evg.py, consultar_gpt.py, aplicar_chatgpt.py, turmas.py, senac_ma.py, centec.py, oxetech.py, pt_br.py, bradesco.py, sebrae.py, gpt_sebrae.py, gpt_certificado.py, catalogo.py]
        default: verificar.py

permissions:
  contents: write
  actions: read

jobs:
  vez:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar que acabem as rotinas anteriores (planilha e repositório compartilhados)
        run: python3 scripts/vez.py esperar

  verificar:
    needs: vez
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Rodar o passo escolhido
        timeout-minutes: 25
        run: cd scripts && python3 "${{ inputs.passo || 'verificar.py' }}"

      - name: Gerar o site a partir da planilha
        if: ${{ always() }}
        run: cd scripts && python3 construir_site.py

      - name: Publicar
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado
          git diff --cached --quiet || (git commit -q -m "Passo manual: ${{ inputs.passo }}" && (git push -q || (git pull -q --rebase -X theirs && git push -q)))
