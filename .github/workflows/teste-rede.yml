name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          from base import Base, carregar_config
          b = Base(); carregar_config(b)
          T = {t["_linha"]: t for t in b.tabela("Turmas")}
          chk = {142: "Informática Básica", 152: "Informática Básica", 137: "Internet na Medida", 138: "Informática Básica", 139: "Informática Básica", 135: "Gestão Assistente Administrativo"}
          for n, nome in chk.items():
              assert T[n].get("Título na fonte") == nome and "Bolsas-Gratuitas-19-2026" in T[n].get("Link da turma", ""), n
          alt = [
            (142, {"Estado": "Publicado", "Auditoria": "2026-11-23: ok (conferido por Claude no PDF do edital 19/2026: Anexo II, Palmeira dos Índios, «13/10/2026 a 26/11/2026» e «Informática Básica 100h 01/12/2026 a 02/02/2027 Segunda a Sexta 08h às 12h 25 Presencial»; os comunicados 01 e 02 só alteram o Anexo I, Arapiraca)."}),
            (152, {"Notas": "Turma repetida (é a mesma da linha 142)."}),
            (137, {"Situação": "Encerrada", "Notas": "Comunicado 01 (26/10/2026): a inscrição passou para 26/10/2026 a 17/11/2026."}),
            (138, {"Situação": "Encerrada", "Notas": "Comunicado 02 (09/11/2026): a inscrição passou para 26/10/2026 a 09/11/2026."}),
            (139, {"Situação": "Encerrada", "Notas": "Comunicado 02 (09/11/2026): a inscrição passou para 26/10/2026 a 09/11/2026."}),
          ]
          b.atualizar("Turmas", alt); b.guardar()
          print("FEITO", len(alt), "| curso da turma 142:", T[142].get("Curso"))
          for r in b.tabela("Cursos"):
              if r.get("ID") == T[142].get("Curso"):
                  print("CURSO", r["_linha"], r.get("Título"), r.get("Estado"), r.get("Situação das inscrições"), r.get("Campos comprovados"))
          PY
