name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import senac_ma as s
          from comum import baixar
          f = next(x for x in s.FONTES if x["nome"] == "Senac AM")
          ed = s.listar_senac_am(f)
          print("== aberturas abertas:", len(ed), "| trechos:", bool(ed and ed[0]["trechos"]))
          for e in ed[:40]:
              print("   ~", e["published_at"], e["number"][:60], "| avisos:", len(e["avisos"]))
          par = next((e for e in ed if "parceria" in e["number"]), None)
          if par:
              t = s.texto_do_documento(baixar(par["pagina"], timeout=60), "application/pdf")
              print("== PARCERIA", par["number"], "::", " ".join(t.split())[:2500])
          PY
