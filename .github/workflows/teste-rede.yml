name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          import re
          from base import Base, carregar_config
          from turmas import hoje_ceara
          b = Base(); carregar_config(b); hoje = hoje_ceara()
          alt = []
          for t in b.tabela("Turmas"):
              m = re.search(r"Inscrições de (\d{2})/(\d{2})/(\d{4})", t.get("Mais informações") or "")
              if t.get("Situação") == "Aberta" and m and f"{m.group(3)}-{m.group(2)}-{m.group(1)}" > hoje:
                  alt.append((t["_linha"], {"Situação": "Por abrir"}))
                  print("POR ABRIR", t["_linha"], t.get("Título na fonte"), t.get("Mais informações")[:60])
          b.atualizar("Turmas", alt); b.guardar()
          PY
