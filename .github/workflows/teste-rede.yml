name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || pip install -q pypdf requests
      - run: |
          cd scripts && python3 - <<'PY'
          import senac_ma as s, re
          u = "https://tecnico.senaibahia.com.br/wp-content/uploads/2026/10/Edital-PS-CHP-2027.1_VF_Chancelado.pdf"
          t = s.texto_do_documento(s.baixar(u, timeout=60), "application/pdf")
          print("CHARS", len(t))
          for kw in ["DAS INSCRI", "PERÍODO DE INSCRI", "CRONOGRAMA", "500", "renda"]:
              for m in list(re.finditer(re.escape(kw), t))[:2]:
                  print("=== ", kw, "@", m.start()); print(t[max(0,m.start()-200):m.start()+900])
          i = t.find("Salvador")
          print("=== TABELA"); print(t[i-1500:i+2500])
          PY
