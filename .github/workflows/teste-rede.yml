name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q pypdf
          B=https://psg.pi.senac.br/media/pdf/vaga
          for f in "EDITAL_PSG_N%C2%BA_006_2026_Visto_CJUR_-_assinado_Presidente.pdf" "EDITAL1.PDF" "COMUNICADO_N%C2%BA_05_DE_ALTERA%C3%87%C3%83O_NO_EDITAL_N%C2%BA_006-2026_.pdf" "COMUNICADO_N04_DE_ALTERACAO_NO_EDITAL_N_006-2026.pdf" "COMUNICADO_N03_DE_ALTERACAO_NO_EDITAL_N006-2026.pdf" "COMUNICADO_N02_DE_ALTERACAO_NO_EDITAL_N006-2026.pdf" "COMUNICADO_N%C2%BA_01_DE_ALTERA%C3%87%C3%83O_NO_EDITAL_N%C2%BA_006-2026__PSG.pdf"; do
            echo "@@@@@@@@@@ $f"; curl -sSLk -m 40 -A "Mozilla/5.0" "$B/$f" -o /tmp/e.pdf || continue
            python3 -c "
          from pypdf import PdfReader
          r=PdfReader('/tmp/e.pdf')
          print('\n'.join((p.extract_text() or '') for p in r.pages))"
          done
