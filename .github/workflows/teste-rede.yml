name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0"
          for p in vagas inscricao programa; do
            echo "=== $p"; curl -sSLk -m 25 -A "$A" "https://psg.pi.senac.br/$p/" -o /tmp/p -w "%{http_code} %{size_download}\n" || true
            python3 - <<'PY'
          import re,html
          t=open('/tmp/p',encoding='utf-8',errors='replace').read()
          t=re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>',' ',t)
          print(sorted(set(re.findall(r'(?:href|action|data-url)="([^"#]+)"',t)))[:40])
          s=html.unescape(re.sub(r'<[^>]+>',' ',t)); s=re.sub(r'\s+',' ',s)
          print(s[:2500])
          PY
          done
