name: Rodar um passo (manual)
run-name: "Só: ${{ inputs.passo }}"
# Roda só um passo (por omissão, a verificação dos cursos) e reconstrói o site, sem pesquisas novas, sem newsletter
# e sem WhatsApp. Serve para testar mudanças sem esperar pelas rotinas diária e semanal.

on:
  workflow_dispatch:
    inputs:
      passo:
        description: "Passo para rodar"
        type: choice
        options: [verificar.py, evg.py, consultar_gpt.py, aplicar_chatgpt.py, turmas.py, senac_ma.py, centec.py, oxetech.py, caminhos_digitais.py, gorecife.py, salvador_tpe.py, senac_pa.py, senai_pa.py, senac_ba.py, senac_rr.py, senac_to.py, senac_ms.py, ifro_fic.py, ifrn_fic.py, senai_rn.py, senai_ro.py, matricula_edital.py, cetam.py, noticias_oficiais.py, vigiar.py, pt_br.py, bradesco.py, fgv.py, escola_trabalhador.py, aprenda_mais.py, sebrae.py, gpt_sebrae.py, gpt_certificado.py, catalogo.py, chatgpt_certificado.py, aplicar_certificado.py, chatgpt_eja.py, aplicar_eja.py, moodle_abertos.py, senac_rs.py]
        default: verificar.py

permissions:
  contents: write
  actions: read

jobs:
  vez:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar que acabem as rotinas anteriores (planilha e repositório compartilhados)
        run: python3 scripts/vez.py esperar

  verificar:
    needs: vez
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Conversores de Word e OCR (só para o leitor de editais)
        if: ${{ inputs.passo == 'senac_ma.py' || inputs.passo == 'cetam.py' || inputs.passo == 'senac_ms.py' }}
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui antiword tesseract-ocr tesseract-ocr-por poppler-utils) > /dev/null 2>&1 || echo "conversores não instalados"

      - name: Rodar o passo escolhido
        timeout-minutes: 25
        env:
          TODOS: ${{ inputs.passo == 'matricula_edital.py' && '1' || '' }}
        run: cd scripts && python3 "${{ inputs.passo || 'verificar.py' }}"

      - name: Gerar o site a partir da planilha
        if: ${{ always() }}
        run: cd scripts && python3 construir_site.py

      - name: Testar o site antes de publicar (lista de cursos num navegador simulado; se falhar, não publica)
        run: |
          npm i --no-save --no-audit --no-fund --silent jsdom@24
          node scripts/testar_site.js || { git checkout -- docs && git clean -fdq docs; echo "::error::O site novo não passou no teste; fica publicada a versão anterior."; exit 1; }
      - name: Publicar
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado
          git diff --cached --quiet || (git commit -q -m "Passo manual: ${{ inputs.passo }}" && bash scripts/enviar.sh)
