name: teste-rede
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python3 scripts/tmp_teste/sondar.py
      - run: cd scripts && SECO=1 python3 senac_ba.py | tee ../sonda/senac_ba.txt
      - run: cd scripts && SECO=1 python3 -c "import vigiar,json; [vigiar.vigiar_wp(None,v) for v in vigiar.VIGIAS if v.get('wp')]" | tee ../sonda/wp.txt; cp ../estado/senai_ba_paginas.json ../sonda/ || true
      - run: |
          git config user.name sonda && git config user.email sonda@users.noreply.github.com
          git checkout -q --orphan sonda-tmp && git rm -rqf --cached . && git add -f sonda && git commit -qm sonda && git push -qf origin sonda-tmp
