name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (X11; Linux x86_64) Chrome/120"
          for u in https://se.senai.br/cursos https://www.rn.senai.br/oportunidades/ https://www.rn.senai.br/publicacoes/ https://www.rn.senai.br/gratuidade/ https://lp.rn.senac.br/programa-de-bolsa https://www.rn.senac.br/psg https://www.se.senac.br/ https://processoseletivo.ifrn.edu.br/ https://www.ifs.edu.br/ https://www.natal.rn.gov.br/ https://www.aracaju.se.gov.br/; do
            echo "======== $u"
            curl -sSL -m 25 -A "$A" -o /tmp/p -w "%{http_code} %{size_download} %{url_effective}\n" "$u" || { echo FALHOU; continue; }
            python3 - <<'PY'
          import re,html
          t=open('/tmp/p',encoding='utf-8',errors='replace').read()
          print("title:",(re.findall(r'<title>(.*?)</title>',t,re.S) or [''])[0].strip()[:100])
          print("js:",sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"',t)))[:6])
          links=sorted(set(l for l in re.findall(r'href="([^"#]+)"',t) if re.search(r'curs|gratu|edital|bolsa|psg|oportun|inscri|turma|selec|\.pdf|api',l,re.I)))[:30]; print("links:",links)
          print("api:",sorted(set(re.findall(r'["\'](/?api/[^"\']{0,80}|https?://[^"\']*/api/[^"\']{0,80}|[^"\']*\.json)["\']',t)))[:10])
          s=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<(script|style).*?</\1>|<[^>]+>',' ',t)))
          i=max(0,s.lower().find('gratuit')-300); print("texto:",s[:300],"...",s[i:i+900])
          PY
          done
