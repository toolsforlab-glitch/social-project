name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          curl -sS -m 60 -A "Mozilla/5.0" -o e.pdf "https://www.cetam.am.gov.br/wp-content/uploads/2026/08/Edital-010-2026-Qualificacao-Profissional-Interior-e-EaD.pdf"
          pdftotext -layout e.pdf e.txt
          L=$(grep -n "AZENILDA" e.txt | head -1 | cut -d: -f1); sed -n "$((L-14)),$((L+10))p" e.txt | cut -c1-175
          echo =====; L=$(grep -n "TRANSTORNO" e.txt | sed -n 2p | cut -d: -f1); sed -n "$((L-8)),$((L+8))p" e.txt | cut -c1-175
          echo =====; L=$(grep -n "WORD AVANÇADO" e.txt | head -1 | cut -d: -f1); sed -n "$((L-30)),$((L+8))p" e.txt | cut -c1-175
