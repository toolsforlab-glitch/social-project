name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.iema.ma.gov.br/ https://web.iema.ma.gov.br/ https://seduc.pi.gov.br/editais https://www.seduc.pi.gov.br/ "https://www.ba.gov.br/educacao/" https://www.seduc.se.gov.br/ https://www.sedepe.pe.gov.br/ https://qualifica.pe.gov.br/ https://processoseletivo.ifrn.edu.br/ https://portal.ifrn.edu.br/ https://ifce.edu.br/ https://portal.ifce.edu.br/ https://estudenoifma.ifma.edu.br/ https://selecao.ifpi.edu.br/ https://www.ifpi.edu.br/ https://www.ifal.edu.br/ https://www.ifs.edu.br/ https://portal.ifba.edu.br/ https://www.ifpb.edu.br/ https://www.ifpe.edu.br/ https://www.ifsertao-pe.edu.br/ https://ifbaiano.edu.br/ ; do
            curl -sS -m 25 -L -A "Mozilla/5.0" -o /tmp/o -w "%{http_code} %{size_download} $u -> %{url_effective}\n" "$u" 2>&1 | tail -1
          done
