name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              return json.loads(urllib.request.urlopen(r, timeout=40).read())
          d = get("https://gorecife.recife.pe.gov.br/api/cursos?page=1")
          print("COUNT", d["count"])
          r0 = d["results"][0]
          print(json.dumps(r0, ensure_ascii=False, indent=1)[:3500])
          todos = d["results"]; u = d["next"]
          while u:
              d = get(u); todos += d["results"]; u = d["next"]
          for c in todos:
              print("C", c.get("id"), "|", c.get("name"), "|", c.get("course_status"), "|", {k: c.get(k) for k in c if any(x in k for x in ("date", "data", "inicio", "fim", "vaga", "inscri", "start", "end", "deadline"))})
          PY
