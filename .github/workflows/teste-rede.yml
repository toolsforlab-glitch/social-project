name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0" "https://www.ro.senac.br/wp-json/wp/v2/media?search=Edital-PSG&per_page=20&_fields=date,source_url" | python3 -c "import sys,json
          try:
            [print(x['date'][:10],x['source_url']) for x in json.load(sys.stdin)]
          except Exception as e: print('ERRO',e)"
          curl -sS -m 30 -A "Mozilla/5.0" "https://www.ro.senac.br/wp-json/wp/v2/posts?search=edital%20psg&per_page=10&_fields=date,link,title" | head -c 1500; echo
          echo ===== AP JS
          curl -sS -m 30 -A "Mozilla/5.0" https://send3.ap.senac.br/send3/resources/site/js/pss_psg.min.js -o ap.js; wc -c ap.js
          grep -oE 'base_url ?\+ ?"[^"]+"|"site/[^"]+"|url: ?[^,]{0,80}' ap.js | sort -u | head -30
