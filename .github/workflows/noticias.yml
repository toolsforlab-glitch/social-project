name: Notícias do dia

on:
  schedule:
    - cron: "17 7 * * *"   # todos os dias às 07:17 UTC (07:17 em Lisboa no inverno, 04:17 em Fortaleza)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projeto-social
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q feedparser

      - name: Escolher e resumir as notícias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd scripts && python3 noticias.py

      - name: Atualizar o site
        run: cd scripts && python3 construir_site.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado
          git diff --cached --quiet || (git commit -q -m "Notícias $(date -u +%F)" && (git push -q || (git pull -q --rebase && git push -q)))
