name: teste-rede (temporário)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python3 - <<'PY'
          from comum import baixar
          for u in ["https://cursosgratuitosapi.fgv.br/api/services/app/OfertaGratuita/GetList?Ordenacao=5&SkipCount=0&MaxResultCount=3",
                    "https://cursosgratuitosapi.fgv.br/api/services/app/OfertaGratuita/GetDetalhe?codigoCurso=acesso-a-informacao",
                    "https://cursosgratuitosapi.fgv.br/api/services/app/Faq/GetAtivas"]:
              try:
                  b = baixar(u, timeout=40); print("==", u, "OK", len(b), b[:150])
              except Exception as e:
                  print("==", u, "ERRO", type(e).__name__, str(e)[:150])
          PY
