name: Atualizar o site

# Corre quando se muda o aspeto do site, ou à mão depois de editar a folha.
on:
  push:
    branches: [main]
    # disparar/site.txt: alterar este ficheiro volta a gerar o site depois de editar a folha
    paths: ["site/**", "scripts/construir_site.py", "disparar/site.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Sem fila partilhada: o GitHub só guarda uma rotina à espera por fila e cancela a anterior.
# A ordem entre rotinas é dada por scripts/vez.py (job "vez").

jobs:
  vez:
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Esperar que acabem as rotinas anteriores (planilha e repositório compartilhados)
        run: python3 scripts/vez.py esperar

  site:
    needs: vez
    # As rotinas só correm depois de ligadas: variável ROTINAS_ATIVAS = sim (Settings > Secrets and variables > Actions > Variables)
    if: ${{ vars.ROTINAS_ATIVAS == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FOLHA_ID: ${{ secrets.FOLHA_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Turmas do Senac (páginas oficiais, sem Claude)
        timeout-minutes: 15
        run: cd scripts && python3 turmas.py || echo 'Turmas não atualizadas'

      - name: Turmas do Centec (página oficial, sem Claude)
        timeout-minutes: 10
        run: cd scripts && python3 centec.py || echo 'Centec não atualizado'

      - name: Verificar e publicar unidades (sem Claude)
        timeout-minutes: 10
        run: cd scripts && python3 verificar_organizacoes.py || echo 'Unidades não verificadas'

      - name: Gerar o site a partir da planilha
        run: cd scripts && python3 construir_site.py
      - name: Auditoria dos requisitos (repetições, termos técnicos, texto cortado; só avisa)
        run: node scripts/auditar_requisitos.js || true
      - name: Testar o site antes de publicar (lista de cursos num navegador simulado; se falhar, não publica)
        run: |
          npm i --no-save --no-audit --no-fund --silent jsdom@24
          node scripts/testar_site.js || { git checkout -- docs && git clean -fdq docs; echo "::error::O site novo não passou no teste; fica publicada a versão anterior."; exit 1; }
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs estado
          git diff --cached --quiet || (git commit -q -m "Site atualizado" && (git push -q || (git pull -q --rebase -X theirs && git push -q)))
