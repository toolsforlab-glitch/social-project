name: teste-rede
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0"
          curl -sL -A "$UA" -m 60 https://gorecife.recife.pe.gov.br/assets/index-bc3bbc61.js -o x.js
          python3 - <<'PY'
          import re
          t = open("x.js", encoding="utf-8", errors="replace").read()
          t = re.sub(r"\\u([0-9a-fA-F]{4})", lambda m: chr(int(m.group(1), 16)), t)
          for kw in ["gratuit", "morador", "residente", "Recife-PE", "sem custo"]:
              for m in list(re.finditer(kw, t, re.I))[:4]:
                  print("==", kw, "::", re.sub(r"\s+", " ", t[max(0, m.start()-160):m.start()+160]))
          PY
          curl -s -A "$UA" "https://gorecife.recife.pe.gov.br/api/cursos/2537" | head -c 300; echo
